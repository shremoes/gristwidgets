<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>
<script>
  grist.ready();

  let lastPaidById = {};

  grist.onRecords(async (records) => {
    if (!records || records.length === 0) return;

    for (const rec of records) {
      const prev = lastPaidById[rec.id] ?? false;
      const curr = rec.Paid === true;

      // Fire ONLY on false -> true transition
      if (!prev && curr) {
        await grist.applyUserActions([
          ['AddRecord', 'Ledger', null, {
            Date: rec.Date,
            Type: 'Income',
            Source: 'Invoice',
            Ref_ID: rec.id,
            Amount: rec.Total,
            Notes: 'Invoice payment'
          }]
        ]);
      }

      lastPaidById[rec.id] = curr;
    }
  });
</script>
</body>
</html>
