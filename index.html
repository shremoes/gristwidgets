<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>
<script>
  grist.ready();

  grist.onRecords(async (records) => {
    if (!records) return;

    for (const rec of records) {
      if (
        rec.Paid === true &&
        rec.LedgerPosted !== true
      ) {
        await grist.applyUserActions([
          ['AddRecord', 'Ledger', null, {
            Date: rec.Date,
            Type: 'Income',
            Source: 'Invoice',
            Ref_ID: rec.id,
            Amount: rec.Total,
            Notes: 'Invoice payment'
          }],
          ['UpdateRecord', 'Invoices', rec.id, {
            LedgerPosted: true
          }]
        ]);
      }
    }
  });
</script>
</body>
</html>
