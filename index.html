<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>
  <pre id="out">waiting…</pre>

<script>
  grist.ready();

  grist.onRecords((records) => {
    document.getElementById('out').textContent =
      JSON.stringify(records, null, 2);
  });
</script>
</body>
</html>
